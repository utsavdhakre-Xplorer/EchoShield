name: Flutter App Checks

on:
  push:
    branches: [main, phase-3-flutter-reliability]
    paths:
      - 'flutter-app/**'
      - '.github/workflows/flutter-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'flutter-app/**'
      - '.github/workflows/flutter-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
